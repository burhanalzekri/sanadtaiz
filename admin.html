<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم المختص · سند تعز</title>
<link rel="stylesheet" href="assets/style.css?v=5">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="logo">س</span> سند تعز</div>
    <nav class="nav">
      <a href="index.html">الرئيسية</a>
      <a href="admin.html" class="active">لوحة التحكم</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>لوحة تحكم المختص</h1>
    <p>إحصائيات المنصة (محلية - على هذا الجهاز)</p>
  </section>

  <div class="grid">
    <div class="card" style="padding: 20px; text-align: center;">
      <h3>الزيارات</h3>
      <p style="font-size: 2em; color: var(--primary); font-weight: bold;" id="visits">0</p>
      <small>إجمالي زياراتك لهذا الجهاز</small>
    </div>
    <div class="card" style="padding: 20px; text-align: center;">
      <h3>الخطوات المكتملة</h3>
      <p style="font-size: 2em; color: var(--accent); font-weight: bold;" id="completed">0</p>
      <small>إجمالي الخطوات التي أكملتها</small>
    </div>
    <div class="card" style="padding: 20px; text-align: center;">
      <h3>الوضع الحالي</h3>
      <p style="font-size: 1.2em; color: var(--text);" id="themeState">نهاري</p>
    </div>
  </div>
</main>

<footer class="wrap" style="text-align:center; padding: 30px;"><p>سند تعز · لوحة خاصة</p></footer>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    let visits = parseInt(localStorage.getItem('sana_visits') || '0') + 1;
    localStorage.setItem('sana_visits', visits);
    document.getElementById('visits').innerText = visits;

    let count = 0;
    for (let i = 0; i < localStorage.length; i++) {
      if (localStorage.getItem(localStorage.key(i)) === 'completed') count++;
    }
    document.getElementById('completed').innerText = count;

    const theme = localStorage.getItem('theme') === 'dark' ? 'ليلي' : 'نهاري';
    document.getElementById('themeState').innerText = theme;
  });
</script>
<script src="assets/app.js"></script>
</body>
</html>
