<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مقالات توعوية · سند تعز</title>
<link rel="stylesheet" href="assets/style.css?v=6">
<style>
  .article-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 10px 25px -5px var(--shadow-color); }
  .article-head { padding: 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .article-head h3 { color: var(--text); font-size: 1.2em; margin: 0; }
  .article-head .tag { font-size: 0.8em; color: var(--primary); background: var(--primary-glow); padding: 3px 10px; border-radius: 15px; }
  .article-body { display: none; padding: 0 20px 20px; color: var(--text-muted); border-top: 1px solid var(--border); }
  .article-body.open { display: block; animation: fadeIn 0.3s; }
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>مقالات توعوية</h1>
    <p>نكسر الوصمة، ونفهم أنفسنا أكثر · قراءة 2-3 دقائق</p>
  </section>

  <div id="articlesContainer">
    <!-- سيتم تحميل المقالات هنا ديناميكياً -->
  </div>
</main>

<script>
  // المقالات الثابتة (الافتراضية)
  const staticArticles = [
    { id: 's1', title: 'حقيقة أم خرافة: طلب المساعدة النفسية يعني "الجنون"؟', content: 'في مجتمعنا، قد يتردد الشخص قبل زيارة أخصائي نفسي خوفاً من كلمة "مجنون". لكن الحقيقة العلمية عكس ذلك تماماً. طلب المساعدة ليس دليلاً على الضعف، بل هو دليل على الوعي والقوة.', tag: 'خرافة' },
    { id: 's2', title: 'كيف أدعم صديقاً أو قريباً يمرّ بضيق؟', content: 'كثيراً ما نريد مساعدة من نحب، لكننا لا نعرف ماذا نقول. ما يحتاجه الشخص فعلاً هو الإنصات الفعّال، التحقق من المشاعر، وتقديم دعم عملي بدلاً من النصائح الجاهزة.', tag: 'مهارات' },
    { id: 's3', title: 'الرجال والدعم النفسي: كسر الوصمة', content: 'تربّينا على أن "الرجل لا يبكي". هذه الأفكار تقتل الرجال بصمت من الداخل. القوة الحقيقية ليست في كتمان الألم، بل في الاعتراف به وطلب المساعدة.', tag: 'خاص بالرجال' }
  ];

  // دالة لجلب المقالات من الذاكرة
  function getDynamicArticles() {
    const stored = localStorage.getItem('sana_articles');
    return stored ? JSON.parse(stored) : [];
  }

  // دمج المقالات وعرضها
  function renderArticles() {
    const dynamicArticles = getDynamicArticles();
    const allArticles = [...staticArticles, ...dynamicArticles];
    const container = document.getElementById('articlesContainer');
    
    if (allArticles.length === 0) {
      container.innerHTML = '<p>لا توجد مقالات حالياً.</p>';
      return;
    }

    container.innerHTML = allArticles.map((a, index) => `
      <div class="article-card">
        <div class="article-head" onclick="toggleArticle(this)">
          <h3>${a.title}</h3>
          <span class="tag">${a.tag || 'جديد'}</span>
        </div>
        <div class="article-body">
          <p>${a.content}</p>
        </div>
      </div>
    `).join('');
  }

  // فتح/إغلاق المقال
  function toggleArticle(header) {
    const body = header.nextElementSibling;
    body.classList.toggle('open');
  }

  document.addEventListener('DOMContentLoaded', renderArticles);
</script>
<script src="assets/app.js"></script>
</body>
</html>
